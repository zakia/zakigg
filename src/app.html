<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta id="theme-color" name="theme-color" content="#f6f9f6" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="zaki.gg" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>
			(() => {
				try {
					const root = document.documentElement;
					const t = localStorage.getItem('theme');
					const gridFixed = localStorage.getItem('zaki.gg:grid-fixed');
					if (t === 'dark' || t === 'light') root.dataset.theme = t;
					function applyNumber(key, property, min, max, unit = 'px') {
						const raw = localStorage.getItem(key);
						if (raw === null || !raw.trim()) return;
						const value = Number(raw);
						if (Number.isFinite(value) && value >= min && value <= max)
							root.style.setProperty(property, `${value}${unit}`);
					}
					applyNumber('hue', '--hue', 0, 360, '');
					applyNumber('zaki.gg:grid-spacing', '--grid-spacing', 24, 112);
					applyNumber('zaki.gg:grid-dot-size', '--grid-dot-size', 0, 6);
					if (gridFixed === 'true' || gridFixed === 'false')
						root.style.setProperty(
							'--grid-background-attachment',
							gridFixed === 'true' ? 'fixed' : 'scroll'
						);

					const themeColor = document.querySelector('#theme-color');
					if (themeColor)
						themeColor.setAttribute(
							'content',
							root.dataset.theme === 'dark' ? '#050605' : '#f6f9f6'
						);
				} catch {}
			})();
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="manifest" href="/manifest.webmanifest" />
		<meta id="theme-color" name="theme-color" content="#f6f9f6" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<meta name="apple-mobile-web-app-title" content="zaki.gg" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<script>
			try {
				const t = localStorage.getItem('theme');
				const h = localStorage.getItem('hue');
				const gridSpacing = localStorage.getItem('zaki.gg:grid-spacing');
				const gridDotSize = localStorage.getItem('zaki.gg:grid-dot-size');
				if (t) document.documentElement.setAttribute('data-theme', t);
				if (h) document.documentElement.style.setProperty('--hue', h);
				if (gridSpacing)
					document.documentElement.style.setProperty('--grid-spacing', `${gridSpacing}px`);
				if (gridDotSize)
					document.documentElement.style.setProperty('--grid-dot-size', `${gridDotSize}px`);

				const themeColor = document.querySelector('#theme-color');
				if (themeColor) themeColor.setAttribute('content', t === 'dark' ? '#050605' : '#f6f9f6');
			} catch (e) {}
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
